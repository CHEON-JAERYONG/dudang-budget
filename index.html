<!doctype html>
<html lang="ko">
<head>

  <meta name="description" content="신혼부부 둘이 함께 쓰는 가계부 — 실시간 동기화, 실시간 시세, 예산·고정지출·목표저축" />
  <meta name="theme-color" content="#fbf6f2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#161419" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <link rel="manifest" href="manifest.webmanifest" />

  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/app.css?v=2.1.2" />
  <script>
    // 테마 깜빡임 방지
    try { const t = JSON.parse(localStorage.getItem('dudang3.theme') || 'null'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="view" id="view" aria-live="polite"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="메뉴"></nav>
  <div id="sheet-root"></div>
  <div class="toast-root" id="toast-root" role="status"></div>
  <div id="screen-root"></div>
  <noscript><p style="padding:24px">자바스크립트를 켜야 가계부를 쓸 수 있어요.</p></noscript>

  <script src="vendor/chart.umd.min.js" defer></script>
  <script src="vendor/qrcode.js" defer></script>
  <script type="module" src="js/app.js?v=2.1.2"></script>
