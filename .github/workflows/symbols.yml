# 매주 월요일 아침 종목 목록(data/symbols.json) 자동 갱신 — 신규 상장 종목도 바로 검색되게
name: 종목 목록 갱신
on:
  schedule:
    - cron: '0 22 * * 0'   # 한국 시간 월요일 07:00
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/update_symbols.py
      - name: 바뀐 게 있으면 저장
        run: |
          if git diff --quiet data/symbols.json; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/symbols.json
          git commit -m "📈 종목 목록 갱신 $(date +%F)"
          git push
